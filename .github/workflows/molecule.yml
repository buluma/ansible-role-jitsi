---
#
# Ansible managed
#

name: Ansible Molecule

on:
  push:
    branches:
      - master
      - main
      - codex
      - testing
  pull_request:
    branches:
      - master
      - main
      - codex
      - testing
  schedule:
    - cron: '19 10 10 * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: ansible-lint
        uses: ansible/ansible-lint@v26.6.0

  molecule:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Jitsi Meet has never published RPM packages (download.jitsi.org is
      # apt-only), so EL/Fedora are dropped - not a supported platform.
      # debian11 and ubuntu2204 are dropped too: their distro archives
      # permanently ship prosody < 0.12 (confirmed via Launchpad), while
      # jitsi-meet-prosody now requires >= 0.12.0 - a structural
      # incompatibility, not something this role can work around.
      matrix:
        distro:
          - image: "docker-molecule-images"
            tag: "debian13"
          - image: "docker-molecule-images"
            tag: "debian12"
          - image: "docker-molecule-images"
            tag: "ubuntu2604"
          - image: "docker-molecule-images"
            tag: "ubuntu2404"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: ansible-role-jitsi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure Docker for systemd
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "features": {
              "buildkit": true
            },
            "exec-opts": ["native.cgroupdriver=systemd"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Test with molecule
        run: |
          cd ansible-role-jitsi
          molecule test
        env:
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1
          ANSIBLE_ROLES_PATH: ~/.ansible/roles:${GITHUB_WORKSPACE}/ansible-role-jitsi
          image: ${{ matrix.distro.image }}
          tag: ${{ matrix.distro.tag }}
